services:
  mysql:
    image: mysql:8.0.44
    container_name: cinema-mysql
    environment:
      MYSQL_DATABASE: cinema_ticketing
      MYSQL_USER: cinema
      MYSQL_PASSWORD: cinema
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucinema", "-pcinema"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7.4-alpine
    container_name: cinema-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: cinema-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cinema
      RABBITMQ_DEFAULT_PASS: cinema
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  cinema-api:
    build: .
    container_name: cinema-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cinema_ticketing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: cinema
      DB_PASSWORD: cinema
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: cinema
      SPRING_RABBITMQ_PASSWORD: cinema
      AI_SERVICE_URL: http://cinema-ai:8000
      AI_INTERNAL_TOKEN: cinema-internal-token
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cinema-ai:
    build: ./cinema-ai
    container_name: cinema-ai
    environment:
      JAVA_API_URL: http://cinema-api:8080
      AI_INTERNAL_TOKEN: cinema-internal-token
    depends_on:
      cinema-api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: cinema-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      cinema-api:
        condition: service_started
      cinema-ai:
        condition: service_started

volumes:
  mysql-data:
