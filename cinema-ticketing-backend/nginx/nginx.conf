events {}

http {
    include /etc/nginx/mime.types;
    upstream cinema_api {
        server cinema-api:8080;
    }

    upstream cinema_ai_gateway {
        server cinema-ai-gateway:8010;
    }

    map $uri $safe_request_uri {
        ~^/api/payments/checkout/ /api/payments/checkout/REDACTED;
        default $uri;
    }
    # Do not persist one-use cashier tokens, signed return query parameters or Referer URLs.
    log_format cinema '$remote_addr [$time_iso8601] "$request_method $safe_request_uri $server_protocol" $status '
                      '$body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/cinema-access.log cinema;
    error_log /var/log/nginx/cinema-error.log warn;

    server {
        listen 80;
        client_max_body_size 6m;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://cinema_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trusted-Proxy cinema-nginx;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /actuator/health {
            proxy_pass http://cinema_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ai-gateway/ {
            proxy_pass http://cinema_ai_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 100s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

