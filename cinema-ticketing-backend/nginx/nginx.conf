events {}

http {
    include /etc/nginx/mime.types;
    upstream cinema_api {
        server cinema-api:8080;
    }

    upstream cinema_ai {
        server cinema-ai:8000;
    }

    log_format cinema '$remote_addr [$time_iso8601] "$request" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/cinema-access.log cinema;
    error_log /var/log/nginx/cinema-error.log warn;

    server {
        listen 80;
        client_max_body_size 6m;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://cinema_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trusted-Proxy cinema-nginx;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /actuator/health {
            proxy_pass http://cinema_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ai/ {
            proxy_pass http://cinema_ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
