<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">影院客服 Agent 推荐链路</title>
  <desc id="desc">从用户问题经过意图分类和条件分流，分别处理风险、人工服务、内部 Agent、知识库问答、信息补充、闲聊和范围外问题。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4263eb"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #182230; }
      .muted { fill: #667085; }
      .line { fill: none; stroke: #98a2b3; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .topline { fill: none; stroke: #4263eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .row { fill: #ffffff; stroke: #e4e7ec; stroke-width: 1.5; }
      .tag { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
      .rowtitle { font-size: 20px; font-weight: 700; }
      .detail { font-size: 15px; fill: #526071; }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="#f7f8fb"/>
  <rect x="56" y="42" width="8" height="72" rx="4" fill="#4263eb"/>
  <text x="84" y="75" font-size="31" font-weight="700">影院客服 Agent 推荐链路</text>
  <text x="84" y="106" font-size="16" class="muted">先识别请求类型，再按知识来源和处理方式分流</text>
  <text x="1535" y="76" text-anchor="end" font-size="14" class="muted">建议结构 · Dify Workflow</text>

  <!-- Main pipeline -->
  <rect x="80" y="170" width="190" height="108" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <circle cx="112" cy="205" r="15" fill="#eef2ff"/>
  <text x="112" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#4263eb">1</text>
  <text x="138" y="211" font-size="20" font-weight="700">用户问题</text>
  <text x="104" y="247" font-size="14" class="muted">保留原始 query</text>

  <path d="M270 224 H330" class="topline" marker-end="url(#arrow-blue)"/>

  <rect x="342" y="155" width="390" height="138" rx="18" fill="#eef2ff" stroke="#b8c5ff" stroke-width="1.5"/>
  <rect x="342" y="155" width="7" height="138" rx="4" fill="#4263eb"/>
  <text x="372" y="193" font-size="14" font-weight="700" fill="#4263eb">分类器</text>
  <text x="372" y="226" font-size="22" font-weight="700">意图分类 LLM2</text>
  <text x="372" y="259" font-size="15" class="muted">只输出一个标签；风险优先判断</text>

  <path d="M732 224 H800" class="topline" marker-end="url(#arrow-blue)"/>

  <rect x="812" y="170" width="310" height="108" rx="18" fill="#ffffff" stroke="#b8c5ff" stroke-width="1.5"/>
  <circle cx="846" cy="205" r="15" fill="#eef2ff"/>
  <text x="846" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#4263eb">2</text>
  <text x="872" y="211" font-size="20" font-weight="700">条件分流</text>
  <text x="836" y="247" font-size="14" class="muted">按标签完全匹配</text>

  <!-- Branch bus -->
  <path d="M967 278 V330 H140 V402" class="line"/>
  <path d="M140 402 V1038" class="line"/>

  <!-- RISK -->
  <path d="M140 402 H205" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="365" width="1300" height="74" rx="14" class="row"/>
  <rect x="240" y="381" width="190" height="42" rx="12" fill="#fff0f0"/>
  <text x="335" y="408" text-anchor="middle" class="tag" fill="#b42318">RISK</text>
  <text x="470" y="397" class="rowtitle">安全拒答</text>
  <text x="470" y="421" class="detail">提示词注入、越权、攻击、内部信息或他人隐私请求</text>

  <!-- HUMAN_SERVICE -->
  <path d="M140 508 H205" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="471" width="1300" height="74" rx="14" class="row"/>
  <rect x="240" y="487" width="190" height="42" rx="12" fill="#fff7e8"/>
  <text x="335" y="514" text-anchor="middle" class="tag" fill="#9a6700">HUMAN_SERVICE</text>
  <text x="470" y="503" class="rowtitle">人工服务引导 / 转接</text>
  <text x="470" y="527" class="detail">只显示热线和服务时间时，标注为“引导”；真实接入坐席才是“转接”</text>

  <!-- INTERNAL_AGENT -->
  <path d="M140 614 H205" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="577" width="1300" height="74" rx="14" class="row"/>
  <rect x="240" y="593" width="190" height="42" rx="12" fill="#eaf4ff"/>
  <text x="335" y="620" text-anchor="middle" class="tag" fill="#175cd3">INTERNAL_AGENT</text>
  <text x="470" y="609" class="rowtitle">内部 Agent</text>
  <text x="470" y="633" class="detail">实时场次、票价、余座、订单状态，以及退票、改签等业务操作</text>

  <!-- KB_FAQ -->
  <path d="M140 720 H205" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="683" width="1300" height="74" rx="14" class="row"/>
  <rect x="240" y="699" width="190" height="42" rx="12" fill="#f4f0ff"/>
  <text x="335" y="726" text-anchor="middle" class="tag" fill="#6941c6">KB_FAQ</text>
  <text x="470" y="715" class="rowtitle">问题改写 → 知识检索 → 回答</text>
  <text x="470" y="739" class="detail">固定政策、流程、影院设施；检索 Query 用 LLM4.text，回答同时接收原问题和检索结果</text>

  <!-- NEED_INFO -->
  <path d="M140 826 H205" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="789" width="1300" height="74" rx="14" class="row"/>
  <rect x="240" y="805" width="190" height="42" rx="12" fill="#fff8db"/>
  <text x="335" y="832" text-anchor="middle" class="tag" fill="#8a5b00">NEED_INFO</text>
  <text x="470" y="821" class="rowtitle">追问必要信息</text>
  <text x="470" y="845" class="detail">请求属于影院业务，但缺少必要条件，且无法从对话上下文补全</text>

  <!-- CHAT -->
  <path d="M140 932 H205" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="895" width="1300" height="74" rx="14" class="row"/>
  <rect x="240" y="911" width="190" height="42" rx="12" fill="#eaf8ef"/>
  <text x="335" y="938" text-anchor="middle" class="tag" fill="#137547">CHAT</text>
  <text x="470" y="927" class="rowtitle">简短聊天回复</text>
  <text x="470" y="951" class="detail">单纯问候、感谢、告别；同时包含影院问题时按影院业务分类</text>

  <!-- OUT_OF_SCOPE -->
  <path d="M140 1038 H205" class="line" marker-end="url(#arrow)"/>
  <rect x="220" y="1001" width="1300" height="74" rx="14" class="row"/>
  <rect x="240" y="1017" width="190" height="42" rx="12" fill="#f2f4f7"/>
  <text x="335" y="1044" text-anchor="middle" class="tag" fill="#475467">OUT_OF_SCOPE</text>
  <text x="470" y="1033" class="rowtitle">提示服务范围</text>
  <text x="470" y="1057" class="detail">合法但与影院业务无关的问题；直接说明可协助的影院业务</text>

  <!-- Configuration notes -->
  <rect x="80" y="1110" width="1440" height="92" rx="16" fill="#eef2f6"/>
  <text x="108" y="1145" font-size="15" font-weight="700" fill="#344054">关键配置</text>
  <text x="250" y="1145" font-size="14" fill="#475467">条件分支按标签精确匹配；人工服务按意图识别，避免仅用“包含 人工”误触发。</text>
  <text x="250" y="1176" font-size="14" fill="#475467">获取当前时间仅放在实时查询分支；知识库回答需同时传入用户原问题与检索 result。</text>
</svg>
