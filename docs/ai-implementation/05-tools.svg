<text x='70' y='1125' class='title'>来源限制与实时规则</text>
<text x='70' y='1159' class='body'>订单号来自用户消息；场次编号来自用户明确输入或本轮已验证结果；不能从助手旧回答猜测。</text>
<text x='70' y='1189' class='body'>can_refund 由 Java 按订单状态、验票、当前时间、启用政策计算；通用政策不能替代本人订单资格。</text>
<text x='70' y='1219' class='body'>工具 readOnlyHint 是描述，真正边界是白名单、受控参数、固定 HTTP / SQL 和部署内网权限。</text>
