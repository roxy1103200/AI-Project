<text x='50' y='103' font-size='36' font-weight='700'>工具执行：模型提议，代码约束，Java 查询</text>
<text x='50' y='139' font-size='19' class='muted'>大模型不持 MySQL 凭证，不接受任意 SQL；模型也不能选择订单所属用户。</text>
