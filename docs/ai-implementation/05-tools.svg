<text x='1125' y='269' class='body'>调用数 / 重复 / 无进展 / 超时</text>
<text x='1125' y='299' class='body'>从可信 state 注入 userId</text>
<text x='1125' y='329' class='body'>ask_user 只追问，不查库</text>
