<text x='70' y='1299' class='body'>error 直接失败；EOF 无 complete 提示回答未完成。</text>
<text x='70' y='1329' class='body'>停止：前端 abort + 网关取消；Dify 额外 stop task。</text>
<text x='70' y='1359' class='body'>已生成但 Redis 保存失败也不能发送成功。</text>
