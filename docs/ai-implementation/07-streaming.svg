<text x='850' y='1265' class='title'>反馈独立持久化</text>
<text x='850' y='1299' class='body'>先 Java 落库；Dify 再同步 feedbacks。</text>
<text x='850' y='1329' class='body'>失败保留本地记录与 FAILED / PENDING 状态。</text>
<text x='850' y='1359' class='body'>Agent 反馈不用同步 Dify；快照 2 小时窗口。</text>
