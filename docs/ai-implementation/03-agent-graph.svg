<text x='65' y='1435' font-size='19' class=''>提前退出边：simple → respond、agent → respond、tools → respond（已产生答案、错误或熔断时）。</text>
<text x='65' y='1465' font-size='19' class=''>主图以文字合并这三条异常边，避免交叉遮挡；它们也是实际条件路由，不会进入 draft / reflect。</text>
<text x='65' y='1495' font-size='19' class=''>硬上限：模型 8 次、ReAct 5 步、无效调用 3 次、反思 1 次；compile() 没有持久 checkpoint。</text>
