<text x='50' y='103' font-size='36' font-weight='700'>追踪与排错：从消息关联到节点、模型与工具</text>
<text x='50' y='139' font-size='19' class='muted'>LangSmith 与本地 trace 只收摘要 / 白名单元数据；这不代表聊天或模型链路没有处理原文。</text>
<rect x='65' y='200' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
