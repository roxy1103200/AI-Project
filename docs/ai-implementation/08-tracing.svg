<path d='M585,580 L495,580' class='edge'/>
<rect x='503' y='541' width='46.0' height='25' rx='4' fill='#f8fafc'/>
<text x='510' y='560' class='label'>排查</text>
<rect x='65' y='815' width='720' height='195' rx='12' fill='#e4f5f1' stroke='#167564' stroke-width='1.5'/>
<rect x='65' y='832' width='4' height='26' rx='2' fill='#167564'/>
<text x='85' y='850' class='title'>目录示例（用户 42 / hash 为示例）</text>
<text x='85' y='884' class='body'>2026_10_12/</text>
<text x='85' y='914' class='body'>  42_2026_10_12_14_24_a1b2c3d4e5f6/</text>
<text x='85' y='944' class='body'>    session.json · traces.jsonl</text>
<text x='85' y='974' class='body'>会话首次目录固定，跨日 / 重启仍归原会话。</text>
<rect x='830' y='815' width='720' height='195' rx='12' fill='#fff3d9' stroke='#a4761c' stroke-width='1.5'/>
<rect x='830' y='832' width='4' height='26' rx='2' fill='#a4761c'/>
<text x='850' y='850' class='title'>质量反馈与评估（另一条链路）</text>
<text x='850' y='884' class='body'>点赞 / 点踩 → Java 持久反馈 → 后台处理</text>
<text x='850' y='914' class='body'>缺槽位 → 补充成功 → 脱敏 silver 待审核样本</text>
<text x='850' y='944' class='body'>evaluation/：golden / A-B / workflow / rerank</text>
<text x='850' y='974' class='body'>历史报告不等于本次重新验证或线上质量保证。</text>
<rect x='50' y='1140' width='1500' height='165' rx='12' fill='#eef1f5' stroke='#617189' stroke-width='1.5'/>
<rect x='50' y='1157' width='4' height='26' rx='2' fill='#617189'/>
<text x='70' y='1175' class='title'>数据边界</text>
<text x='70' y='1209' class='body'>追踪不保留完整问题、prompt、SQL、工具行或凭证；本地会话清单含 userId，云端会话用 hash 关联。</text>
<text x='70' y='1239' class='body'>模型可能收到问题 / 历史 / 业务观察；Redis 问答、MySQL 反馈与记忆可以含正文，不能与追踪脱敏混为一谈。</text>
<text x='70' y='1269' class='body'>排错先看 HTTP / error / complete，再关联网关日志与 trace；health UP 只证明进程存活与配置摘要。</text>
<line x1='50' y1='1377' x2='1550' y2='1377' stroke='#d9e0ea'/>
<text x='50' y='1405' font-size='15' class='muted'>基于当前工作区代码 · 2026-10-12 · 默认值不代表运行配置 · 完整说明见 README.md / source-index.md</text>
