<text x='85' y='235' class='title'>① 网关消息关联</text>
<text x='85' y='269' class='body'>messageId / provider / stage</text>
<text x='85' y='299' class='body'>Agent 上游 trace UUID 写日志</text>
<text x='85' y='329' class='body'>不把私有 trace 详情直接发浏览器</text>
<rect x='585' y='200' width='430' height='165' rx='12' fill='#f0ebff' stroke='#7450a3' stroke-width='1.5'/>
<rect x='585' y='217' width='4' height='26' rx='2' fill='#7450a3'/>
<text x='605' y='235' class='title'>② Agent 每轮根 span</text>
<text x='605' y='269' class='body'>cinema.agent.live / chat</text>
<text x='605' y='299' class='body'>用户会话 hash / root trace_id</text>
<text x='605' y='329' class='body'>节点 → 模型 / 工具子 span</text>
<rect x='1105' y='200' width='430' height='165' rx='12' fill='#fff3d9' stroke='#a4761c' stroke-width='1.5'/>
<rect x='1105' y='217' width='4' height='26' rx='2' fill='#a4761c'/>
<text x='1125' y='235' class='title'>③ MetadataOnlyClient</text>
<text x='1125' y='269' class='body'>拦截 SDK create / update / batch</text>
<text x='1125' y='299' class='body'>清洗 input / output / error</text>
<text x='1125' y='329' class='body'>固定字段、计数、版本和来源摘要</text>
<path d='M495,280 L585,280' class='edge'/>
<rect x='498' y='241' width='46.0' height='25' rx='4' fill='#f8fafc'/>
<text x='505' y='260' class='label'>关联</text>
<path d='M1015,280 L1105,280' class='edge'/>
<rect x='1105' y='500' width='430' height='165' rx='12' fill='#f0ebff' stroke='#7450a3' stroke-width='1.5'/>
<rect x='1105' y='517' width='4' height='26' rx='2' fill='#7450a3'/>
<text x='1125' y='535' class='title'>④ LangSmith 云端</text>
<text x='1125' y='569' class='body'>节点耗时 / 模型 / 工具 / 错误</text>
<text x='1125' y='599' class='body'>local / test / preprod 显式开启</text>
<text x='1125' y='629' class='body'>启用不等于权限与上传已验证</text>
<rect x='585' y='500' width='430' height='165' rx='12' fill='#e4f5f1' stroke='#167564' stroke-width='1.5'/>
<rect x='585' y='517' width='4' height='26' rx='2' fill='#167564'/>
<text x='605' y='535' class='title'>⑤ 本地用户会话归档</text>
<text x='605' y='569' class='body'>langsmith(tracing)/日期/用户会话</text>
<text x='605' y='599' class='body'>session.json + traces.jsonl</text>
<text x='605' y='629' class='body'>SQLite 索引关联延迟回调</text>
<rect x='65' y='500' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
<rect x='65' y='517' width='4' height='26' rx='2' fill='#3262a8'/>
<text x='85' y='535' class='title'>⑥ 定位失败发生阶段</text>
<text x='85' y='569' class='body'>理解 → 决策 → MCP / Java</text>
<text x='85' y='599' class='body'>→ 反思 → 流完成 → 持久化</text>
<text x='85' y='629' class='body'>区分错误码、阶段、状态与耗时</text>
<path d='M1320,365 L1320,500' class='edge'/>
<path d='M1200,365 L1200,435 L800,435 L800,500' class='edge'/>
