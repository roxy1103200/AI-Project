<text x='50' y='55' font-size='16' fill='#167564' letter-spacing='3'>CINEMA AI / CODE ATLAS · 04</text>
<text x='50' y='103' font-size='36' font-weight='700'>问题理解：先确定规则，再按需要调用模型</text>
<text x='50' y='139' font-size='19' class='muted'>模型分类不产生授权；日期、范围、订单号与场次号最终仍由代码绑定来源。</text>
<rect x='65' y='200' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
<rect x='65' y='217' width='4' height='26' rx='2' fill='#3262a8'/>
<text x='85' y='235' class='title'>① 规范化 + 规则解析</text>
<text x='85' y='269' class='body'>中文同义表达 / 北京时间日期</text>
<text x='85' y='299' class='body'>保留用户编号与明确片名</text>
<text x='85' y='329' class='body'>构造 QuestionPlan 与槽位</text>
<rect x='585' y='200' width='430' height='165' rx='12' fill='#fff3d9' stroke='#a4761c' stroke-width='1.5'/>
<rect x='585' y='217' width='4' height='26' rx='2' fill='#a4761c'/>
<text x='605' y='235' class='title'>② 预检与澄清</text>
<text x='605' y='269' class='body'>无效日期 / 越界写操作</text>
<text x='605' y='299' class='body'>缺关键 ID / 含糊日期</text>
<text x='605' y='329' class='body'>不能猜，需用户补条件</text>
<rect x='1105' y='200' width='430' height='165' rx='12' fill='#e4f5f1' stroke='#167564' stroke-width='1.5'/>
<rect x='1105' y='217' width='4' height='26' rx='2' fill='#167564'/>
<text x='1125' y='235' class='title'>③ L0 确定性路由</text>
<text x='1125' y='269' class='body'>问候 / 明确订单号与场次号</text>
<text x='1125' y='299' class='body'>明确单片资料 / 日期场次</text>
<text x='1125' y='329' class='body'>命中且安全 → 直接计划</text>
<path d='M495,280 L585,280' class='edge'/>
<path d='M1015,280 L1105,280' class='edge'/>
<rect x='1008' y='241' width='94.0' height='25' rx='4' fill='#f8fafc'/>
<text x='1015' y='260' class='label'>预检可继续</text>
<rect x='1105' y='490' width='430' height='165' rx='12' fill='#e4f5f1' stroke='#167564' stroke-width='1.5'/>
<rect x='1105' y='507' width='4' height='26' rx='2' fill='#167564'/>
<text x='1125' y='525' class='title'>④ 可选本地 fastText</text>
<text x='1125' y='559' class='body'>默认关闭；已验证模型才加载</text>
<text x='1125' y='589' class='body'>hash + manifest + 九标签</text>
<text x='1125' y='619' class='body'>高置信且与规则一致才接纳</text>
<rect x='585' y='490' width='430' height='165' rx='12' fill='#f0ebff' stroke='#7450a3' stroke-width='1.5'/>
<rect x='585' y='507' width='4' height='26' rx='2' fill='#7450a3'/>
<text x='605' y='525' class='title'>⑤ B 组可选 GLM L1</text>
<text x='605' y='559' class='body'>单任务、适用问题才尝试</text>
<text x='605' y='589' class='body'>320 tokens / 默认 6 秒 / 单并发</text>
<text x='605' y='619' class='body'>接受阈值默认 0.90</text>
<rect x='65' y='490' width='430' height='165' rx='12' fill='#f0ebff' stroke='#7450a3' stroke-width='1.5'/>
<rect x='65' y='507' width='4' height='26' rx='2' fill='#7450a3'/>
<text x='85' y='525' class='title'>⑥ Qwen 结构化兜底</text>
<text x='85' y='559' class='body'>复杂 / 上下文 / 未通过分类</text>
<text x='85' y='589' class='body'>受约束 JSON，最多 1,000 输出</text>
<text x='85' y='619' class='body'>理解调用还有 15 秒期限</text>
<path d='M1320,365 L1320,490' class='edge'/>
<rect x='1328' y='411' width='62.0' height='25' rx='4' fill='#f8fafc'/>
<text x='1335' y='430' class='label'>未命中</text>
<path d='M1105,570 L1015,570' class='edge'/>
<rect x='1008' y='531' width='62.0' height='25' rx='4' fill='#f8fafc'/>
<text x='1015' y='550' class='label'>未接纳</text>
<path d='M585,570 L495,570' class='edge'/>
<rect x='283' y='436' width='185.5' height='25' rx='4' fill='#f8fafc'/>
<text x='290' y='455' class='label'>A 组跳过 / B 组未通过</text>
<rect x='65' y='795' width='430' height='165' rx='12' fill='#fff3d9' stroke='#a4761c' stroke-width='1.5'/>
<rect x='65' y='812' width='4' height='26' rx='2' fill='#a4761c'/>
<text x='85' y='830' class='title'>⑦ 代码重新验证</text>
<text x='85' y='864' class='body'>还原规则日期 / 范围 / 片名</text>
<text x='85' y='894' class='body'>编号只能来自用户可靠来源</text>
<text x='85' y='924' class='body'>低置信 / 缺槽位 → 澄清</text>
<rect x='585' y='795' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
<rect x='585' y='812' width='4' height='26' rx='2' fill='#3262a8'/>
<text x='605' y='830' class='title'>⑧ tasks + 代码选 route</text>
<text x='605' y='864' class='body'>单任务完整高置信 → Simple</text>
<text x='605' y='894' class='body'>多个任务 / 依赖 / 不确定 → ReAct</text>
<text x='605' y='924' class='body'>chat / unsupported → 直接响应</text>
<rect x='1105' y='795' width='430' height='165' rx='12' fill='#eef1f5' stroke='#617189' stroke-width='1.5'/>
<rect x='1105' y='812' width='4' height='26' rx='2' fill='#617189'/>
<text x='1125' y='830' class='title'>A/B：按用户会话稳定分组</text>
<text x='1125' y='864' class='body'>A：L0 + Qwen + 校验</text>
<text x='1125' y='894' class='body'>B：增加 GLM L1，默认 50%</text>
<text x='1125' y='924' class='body'>关 A/B 当前为全 B；可强制组别</text>
<path d='M280,655 L280,795' class='edge'/>
