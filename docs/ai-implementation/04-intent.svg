<rect x='523' y='686' width='239.0' height='25' rx='4' fill='#f8fafc'/>
<text x='530' y='705' class='label'>任一层已接纳 → 跳过后续模型</text>
<path d='M1250,655 L1250,720 L1060,720' class='edge' stroke-dasharray='7 5'/>
<path d='M800,655 L800,720' class='edge' stroke-dasharray='7 5'/>
