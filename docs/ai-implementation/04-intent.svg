<rect x='50' y='1090' width='1500' height='165' rx='12' fill='#eef1f5' stroke='#617189' stroke-width='1.5'/>
<rect x='50' y='1107' width='4' height='26' rx='2' fill='#617189'/>
<text x='70' y='1125' class='title'>接纳不等于盲信：模型输出还要通过业务约束</text>
<text x='70' y='1159' class='body'>GLM 字段须在原问题中有依据，不得扩展任务、改范围、伪造 ID；429 冷却 30 秒，超时冷却 10 秒。</text>
<text x='70' y='1189' class='body'>本地分类 / GLM / Qwen 理解均不能直接查库；最终输出 QuestionPlan 后才能进入受预算约束的工具执行。</text>
<text x='70' y='1219' class='body'>catalog 是资料；showing 是上映属性；scheduled 是真实排期；bookable 是此刻能买，不能互相替代。</text>
