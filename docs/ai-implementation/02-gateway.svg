<title id='title'>AI 网关：每次请求都证明身份与会话归属</title><desc id='desc'>sessionStorage 只隔离标签页账号；Redis 支持同账号、同通道跨设备恢复。</desc>
<defs><marker id='arrow' markerWidth='9' markerHeight='9' refX='8' refY='4.5' orient='auto-start-reverse'><path d='M0,0 L9,4.5 L0,9' fill='#617189'/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#203047} .body{font-size:19px} .muted{fill:#617189} .edge{fill:none;stroke:#617189;stroke-width:2.2;marker-end:url(#arrow);stroke-linejoin:round} .label{font-size:16px;fill:#43556f} .title{font-size:23px;font-weight:700}</style>
<rect width='1600' height='1360' fill='#f8fafc'/>
<rect x='0' y='0' width='1600' height='8' fill='#167564'/>
<text x='50' y='55' font-size='16' fill='#167564' letter-spacing='3'>CINEMA AI / CODE ATLAS · 02</text>
<text x='50' y='103' font-size='36' font-weight='700'>AI 网关：每次请求都证明身份与会话归属</text>
<text x='50' y='139' font-size='19' class='muted'>sessionStorage 只隔离标签页账号；Redis 支持同账号、同通道跨设备恢复。</text>
<rect x='65' y='200' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
<rect x='65' y='217' width='4' height='26' rx='2' fill='#3262a8'/>
<text x='85' y='235' class='title'>① 标签页请求</text>
<text x='85' y='269' class='body'>token + bindingKey + sessionId</text>
<text x='85' y='299' class='body'>POST question；Agent 带 credential</text>
<text x='85' y='329' class='body'>credentials: omit，不用共享 Cookie</text>
<rect x='585' y='200' width='430' height='165' rx='12' fill='#fff3d9' stroke='#a4761c' stroke-width='1.5'/>
<rect x='585' y='217' width='4' height='26' rx='2' fill='#a4761c'/>
<text x='605' y='235' class='title'>② Java 核验当前登录</text>
<text x='605' y='269' class='body'>/internal/ai/auth/resolve</text>
<text x='605' y='299' class='body'>取可信 userId / role / lifetime</text>
<text x='605' y='329' class='body'>失效 401；不可用 503，拒绝放行</text>
<rect x='1105' y='200' width='430' height='165' rx='12' fill='#e4f5f1' stroke='#167564' stroke-width='1.5'/>
<rect x='1105' y='217' width='4' height='26' rx='2' fill='#167564'/>
<text x='1125' y='235' class='title'>③ Redis 证明会话归属</text>
<text x='1125' y='269' class='body'>绑定 token 必须等于本次 token</text>
<text x='1125' y='299' class='body'>owner / UUID / 活动指针吻合</text>
<text x='1125' y='329' class='body'>Dify 匿名可用；Agent 要登录</text>
<path d='M495,280 L585,280' class='edge'/>
<path d='M1015,280 L1105,280' class='edge'/>
<rect x='1105' y='495' width='430' height='165' rx='12' fill='#e4f5f1' stroke='#167564' stroke-width='1.5'/>
<rect x='1105' y='512' width='4' height='26' rx='2' fill='#167564'/>
<text x='1125' y='530' class='title'>④ 限流与分布式租约</text>
<text x='1125' y='564' class='body'>每会话聊天 12 / min</text>
<text x='1125' y='594' class='body'>同会话一个生成；全局默认 16</text>
<text x='1125' y='624' class='body'>120 秒租约，原子获取 / 释放</text>
<rect x='585' y='495' width='430' height='165' rx='12' fill='#f0ebff' stroke='#7450a3' stroke-width='1.5'/>
<rect x='585' y='512' width='4' height='26' rx='2' fill='#7450a3'/>
<text x='605' y='530' class='title'>⑤ 选择固定通道</text>
<text x='605' y='564' class='body'>Dify：云端 API + provider IDs</text>
<text x='605' y='594' class='body'>Agent：凭证解出 owner / session</text>
<text x='605' y='624' class='body'>要求匹配 cinema:read，再转发</text>
<rect x='65' y='495' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
<rect x='65' y='512' width='4' height='26' rx='2' fill='#3262a8'/>
<text x='85' y='530' class='title'>⑥ 流期间监测</text>
<text x='85' y='564' class='body'>约 0.5 秒检查取消标记</text>
<text x='85' y='594' class='body'>约 2 秒复核已登录用户身份</text>
<text x='85' y='624' class='body'>整轮 90 秒；失效 / 中止即取消</text>
<path d='M1320,365 L1320,495' class='edge'/>
<path d='M1105,575 L1015,575' class='edge'/>
<path d='M585,575 L495,575' class='edge'/>
<rect x='65' y='790' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
<rect x='65' y='807' width='4' height='26' rx='2' fill='#3262a8'/>
<text x='85' y='825' class='title'>⑦ 规范化上游事件</text>
<text x='85' y='859' class='body'>message / status / delta / error</text>
<text x='85' y='889' class='body'>答案最多 40,000 字符</text>
<text x='85' y='919' class='body'>暂存 complete，先完成持久化</text>
<rect x='585' y='790' width='430' height='165' rx='12' fill='#e4f5f1' stroke='#167564' stroke-width='1.5'/>
<rect x='585' y='807' width='4' height='26' rx='2' fill='#167564'/>
<text x='605' y='825' class='title'>⑧ 持久化并释放租约</text>
<text x='605' y='859' class='body'>快照 2 小时；回答快照 8,000 字</text>
<text x='605' y='889' class='body'>历史保留 40 条消息</text>
<text x='605' y='919' class='body'>保存失败不能发送成功 complete</text>
<rect x='1105' y='790' width='430' height='165' rx='12' fill='#eaf2ff' stroke='#3262a8' stroke-width='1.5'/>
<rect x='1105' y='807' width='4' height='26' rx='2' fill='#3262a8'/>
<text x='1125' y='825' class='title'>⑨ 浏览器确认结束</text>
<text x='1125' y='859' class='body'>complete → 本轮协议完成</text>
<text x='1125' y='889' class='body'>error / EOF 无 complete → 失败</text>
<text x='1125' y='919' class='body'>stop / reset / feedback 再次验权</text>
<path d='M280,660 L280,790' class='edge'/>
<path d='M495,875 L585,875' class='edge'/>
<path d='M1015,875 L1105,875' class='edge'/>
<rect x='50' y='1080' width='1500' height='165' rx='12' fill='#eef1f5' stroke='#617189' stroke-width='1.5'/>
<rect x='50' y='1097' width='4' height='26' rx='2' fill='#617189'/>
<text x='70' y='1115' class='title'>Redis 生命周期与共享范围</text>
<text x='70' y='1149' class='body'>匿名 1 天；账号滑动 30 天；绑定 1 天；Dify / Agent 命名空间与历史独立。</text>
<text x='70' y='1179' class='body'>账号每通道一个活动会话：重置后其他设备的旧会话返回冲突，需要恢复连接。</text>
<text x='70' y='1209' class='body'>多 worker 共享 Redis / namespace 才共享租约与历史；Redis 故障时入口拒绝继续。</text>
<line x1='50' y1='1307' x2='1550' y2='1307' stroke='#d9e0ea'/>
<text x='50' y='1335' font-size='15' class='muted'>基于当前工作区代码 · 2026-10-12 · 默认值不代表运行配置 · 完整说明见 README.md / source-index.md</text>
</svg>