<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1140" viewBox="0 0 1420 1140" role="img" aria-labelledby="title desc">
  <title id="title">影院 Agent LangGraph 状态图：节点与条件边</title>
  <desc id="desc">START 进入 prepare，prepare 按 needs_clarification、chat、其余查询分成三条条件边；agent 与 tools 之间是图中唯一的循环，agent 用模型选择只读工具，tools 执行并校验后把结果或错误交回 agent；clarify、agent、tools 的终止分支统一汇入 respond，再经 SSE 返回浏览器。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526274"/></marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#146d72"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;fill:#172c3e}
      .title{font-size:20px;font-weight:600}
      .detail{font-size:15px;fill:#526274}
      .mono{font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#146d72}
      .edge{fill:none;stroke:#526274;stroke-width:2;marker-end:url(#arrow)}
      .loop{fill:none;stroke:#146d72;stroke-width:2.5;marker-end:url(#loopArrow)}
      .label{font-size:13px;fill:#526274}
      .labelloop{font-size:13px;font-weight:600;fill:#146d72}
    </style>
  </defs>
  <rect width="1420" height="1140" fill="#f7f9fb"/>
  <text x="40" y="46" font-size="27" font-weight="600">影院 Agent：LangGraph 状态图与条件边</text>
  <text x="40" y="76" class="detail">/ai/chat（一次 invoke）与 /ai/live（SSE astream）共用同一张已 compile 的图；节点内文案取自 react_agent.py 的实际实现</text>

  <!-- START -->
  <rect x="510" y="90" width="380" height="56" rx="12" fill="#fff" stroke="#aab8c4" stroke-width="1.5"/>
  <text x="700" y="125" text-anchor="middle" class="title">START · 用户问题 + 历史（末 10 条）</text>

  <!-- prepare -->
  <rect x="450" y="186" width="500" height="130" rx="12" fill="#fff" stroke="#aab8c4" stroke-width="1.5"/>
  <text x="700" y="222" text-anchor="middle" class="title">prepare · 理解问题与校验参数</text>
  <text x="700" y="252" text-anchor="middle" class="detail">understand() 意图 + 实体 + 归一化问题</text>
  <text x="700" y="278" text-anchor="middle" class="detail">build_tasks() 拆子任务 · recall_memory() 取偏好</text>
  <text x="700" y="304" text-anchor="middle" class="detail">needs_clarification = bool(clarification)</text>

  <!-- clarify -->
  <rect x="70" y="390" width="300" height="130" rx="12" fill="#fff" stroke="#aab8c4" stroke-width="1.5"/>
  <text x="220" y="428" text-anchor="middle" class="title">clarify · 追问</text>
  <text x="220" y="458" text-anchor="middle" class="detail">answer = clarification</text>
  <text x="220" y="484" text-anchor="middle" class="detail">本轮结束，等待用户补充</text>

  <!-- agent -->
  <rect x="360" y="390" width="500" height="170" rx="12" fill="#edf7f6" stroke="#146d72" stroke-width="2"/>
  <text x="610" y="426" text-anchor="middle" class="title">agent · 决策（循环入口）</text>
  <text x="610" y="456" text-anchor="middle" class="detail">守卫：任务已完成 / 调用 4 次 / 无效 3 次 / 轮次 8</text>
  <text x="610" y="482" text-anchor="middle" class="detail">bind_tools(7 个工具).ainvoke()，单次 20s 超时</text>
  <text x="610" y="508" text-anchor="middle" class="detail">无 tool_calls 时 next_call() 补一次</text>
  <text x="610" y="534" text-anchor="middle" class="detail">模型异常 → fallback_call() 确定性降级</text>
  <text x="610" y="556" text-anchor="middle" font-size="13" fill="#146d72">命中守卫时 pending_calls = []</text>

  <!-- tools -->
  <rect x="1010" y="390" width="320" height="170" rx="12" fill="#edf7f6" stroke="#146d72" stroke-width="2"/>
  <text x="1170" y="426" text-anchor="middle" class="title">tools · 执行与校验</text>
  <text x="1170" y="458" text-anchor="middle" class="detail">白名单 + 参数校验</text>
  <text x="1170" y="484" text-anchor="middle" class="detail">订单号 / 场次 ID 来源</text>
  <text x="1170" y="510" text-anchor="middle" class="detail">validate_result() 结果契约</text>
  <text x="1170" y="536" text-anchor="middle" class="detail">ask_user 不占调用预算</text>

  <!-- respond -->
  <rect x="280" y="700" width="760" height="150" rx="12" fill="#fff" stroke="#aab8c4" stroke-width="1.5"/>
  <text x="660" y="738" text-anchor="middle" class="title">respond · 组织答复或返回错误</text>
  <text x="660" y="770" text-anchor="middle" class="detail">error / answer → 直接输出；无观测 → agent_no_evidence</text>
  <text x="660" y="796" text-anchor="middle" class="detail">有证据 → ANSWER_PROMPT 流式生成 或 factual_answer() 回落到事实模板</text>
  <text x="660" y="822" text-anchor="middle" class="detail">completion_note() 说明未完成子任务与降级原因</text>

  <!-- END -->
  <rect x="510" y="890" width="380" height="64" rx="12" fill="#fff" stroke="#aab8c4" stroke-width="1.5"/>
  <text x="700" y="922" text-anchor="middle" class="title">END · SSE → 网关 → 浏览器</text>
  <text x="700" y="944" text-anchor="middle" font-size="13" fill="#526274">respond 是唯一出口，无回边</text>

  <!-- 预算面板 -->
  <rect x="1090" y="620" width="290" height="250" rx="12" fill="#fff" stroke="#aab8c4" stroke-width="1.5"/>
  <text x="1114" y="656" font-size="19" font-weight="600">预算与闭环上限</text>
  <text x="1114" y="688" class="mono">AGENT_MAX_TOOL_CALLS = 4</text>
  <text x="1114" y="710" class="label">可调范围 1–8，统计真实业务调用</text>
  <text x="1114" y="740" class="mono">AGENT_MAX_INVALID_CALLS = 3</text>
  <text x="1114" y="762" class="label">可调范围 1–4，独立于调用预算</text>
  <text x="1114" y="792" class="mono">recursion_limit = 2×(4+3)+10 = 24</text>
  <text x="1114" y="820" class="label">单次决策 20s · 整轮请求 80s</text>
  <text x="1114" y="848" class="label">7 个工具 = 6 只读业务 + ask_user</text>

  <!-- 边：START → prepare -->
  <path d="M700 146 V186" class="edge"/>

  <!-- 边：prepare → chat 快捷分支 -->
  <path d="M450 225 H40 V780 H280" class="edge"/>
  <text x="60" y="214" class="label">intent == chat（问候直达）</text>

  <!-- 边：prepare → clarify -->
  <path d="M450 292 H220 V390" class="edge"/>
  <text x="234" y="282" class="label">needs_clarification（优先级最高）</text>

  <!-- 边：prepare → agent -->
  <path d="M700 316 V390" class="edge"/>
  <text x="714" y="358" class="label">else：存在查询任务</text>

  <!-- 边：clarify → respond -->
  <path d="M220 520 V620 H430 V700" class="edge"/>
  <text x="232" y="600" class="label">answer 已定</text>

  <!-- 边：agent → tools（循环） -->
  <path d="M860 470 H1010" class="loop"/>
  <text x="935" y="456" text-anchor="middle" class="labelloop">pending_calls 非空</text>

  <!-- 边：tools → agent（回边，唯一的循环） -->
  <path d="M1010 540 H860" class="loop"/>
  <text x="935" y="566" text-anchor="middle" class="labelloop">继续：结果交回 agent</text>

  <!-- 边：agent → respond -->
  <path d="M610 560 V700" class="edge"/>
  <text x="624" y="640" class="label">pending_calls 为空（完成 / 预算耗尽）</text>

  <!-- 边：tools → respond -->
  <path d="M1170 560 V600 H900 V700" class="edge"/>
  <text x="1010" y="590" class="label">error 或 answer（ask_user、契约/归属失败）</text>

  <!-- 边：respond → END -->
  <path d="M700 850 V890" class="edge"/>

  <rect x="40" y="1010" width="1340" height="86" rx="10" fill="#edf7f6" stroke="#146d72" stroke-width="1.5"/>
  <text x="64" y="1042" font-size="15" fill="#146d72" font-weight="600">读图要点</text>
  <text x="64" y="1068" class="detail">① 图中唯一的环是 agent ⇄ tools；respond 无回边，一轮请求只出图一次。② 三条条件边都从 prepare / agent / tools 出发，判定表达式已标在线上。</text>
  <text x="64" y="1088" class="detail">③ clarify 是独立的终态分支，ask_user 走的是 agent → tools → respond，二者不共用一个节点。</text>
</svg>
